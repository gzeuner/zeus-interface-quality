name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: JDK 21 build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: ./mvnw -B test

      - name: Build package
        run: ./mvnw -B package

      - name: Smoke test valid fixture
        run: >-
          java -jar target/zeus-interface-quality-0.1.0-SNAPSHOT.jar validate
          --schema src/test/resources/fixtures/delivery.schema.json
          --input src/test/resources/fixtures/valid-delivery.json

      - name: Smoke test invalid fixture
        shell: bash
        run: |
          set +e
          java -jar target/zeus-interface-quality-0.1.0-SNAPSHOT.jar validate \
            --schema src/test/resources/fixtures/delivery.schema.json \
            --input src/test/resources/fixtures/invalid-wrong-type.json
          exit_code=$?
          test "$exit_code" -eq 1

      - name: Smoke test valid fixed-width fixture
        run: >-
          java -jar target/zeus-interface-quality-0.1.0-SNAPSHOT.jar validate
          --input-format fixed-width
          --schema src/test/resources/fixtures/fixedwidth/delivery.cobol-profile.json
          --input src/test/resources/fixtures/fixedwidth/valid-delivery.dat

      - name: Smoke test invalid fixed-width fixture
        shell: bash
        run: |
          set +e
          java -jar target/zeus-interface-quality-0.1.0-SNAPSHOT.jar validate \
            --input-format fixed-width \
            --schema src/test/resources/fixtures/fixedwidth/delivery.cobol-profile.json \
            --input src/test/resources/fixtures/fixedwidth/invalid-wrong-type.dat
          exit_code=$?
          test "$exit_code" -eq 1

      - name: Smoke test valid CSV fixture
        run: >-
          java -jar target/zeus-interface-quality-0.1.0-SNAPSHOT.jar validate
          --input-format csv
          --schema src/test/resources/fixtures/csv/delivery.csv-profile.json
          --input src/test/resources/fixtures/csv/valid-delivery.csv

      - name: Smoke test invalid CSV fixture
        shell: bash
        run: |
          set +e
          java -jar target/zeus-interface-quality-0.1.0-SNAPSHOT.jar validate \
            --input-format csv \
            --schema src/test/resources/fixtures/csv/delivery.csv-profile.json \
            --input src/test/resources/fixtures/csv/invalid-wrong-type.csv
          exit_code=$?
          test "$exit_code" -eq 1
